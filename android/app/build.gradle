plugins { id 'com.android.application' }

android {
    namespace 'family.storygarden.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'family.storygarden.reader'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '2.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('STORY_ANDROID_KEYSTORE_FILE') ?: 'signing.p12')
            storePassword System.getenv('STORY_ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'storygarden'
            keyPassword System.getenv('STORY_ANDROID_KEYSTORE_PASSWORD') ?: ''
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
