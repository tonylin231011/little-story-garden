name: Build offline Android reader
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'public/**', 'index.html', 'scripts/build.mjs', 'package*.json', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -a dist/. android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private signing key
        env:
          SIGNING_KEY: ${{ secrets.STORY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/signing.p12
      - name: Build installable APK
        env:
          STORY_ANDROID_KEYSTORE_FILE: signing.p12
          STORY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STORY_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: little-story-garden-offline-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
